x-app: &app
  image: ${MAGENTO_IMAGE:-clean-magento-php:local}
  environment: &app-env
    BASE_URL: ${BASE_URL:-http://localhost:8090/}
    DB_PASSWORD: ${DB_PASSWORD:?Run bin/setup first}
    ADMIN_USER: ${ADMIN_USER:-admin}
    ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
    ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
    CACHE_ENGINE: ${CACHE_ENGINE:-valkey}
    RABBITMQ_USER: ${RABBITMQ_USER:-magento}
    RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}
    ERP_BASE_URL: http://erp:8080
    ERP_API_TOKEN: ${ERP_API_TOKEN:?Set ERP_API_TOKEN}
  volumes: &app-volumes
    - app-config:/var/www/html/app/etc
    - media:/var/www/html/pub/media
    - app-var:/var/www/html/var
    - generated:/var/www/html/generated
    - static:/var/www/html/pub/static
    - varnish-config:/varnish

services:
  db:
    image: mariadb:12.3
    environment:
      MARIADB_DATABASE: magento
      MARIADB_USER: magento
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD}
    volumes: [db-data:/var/lib/mysql]
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      timeout: 5s
      retries: 60
    restart: unless-stopped

  search:
    image: opensearchproject/opensearch:3.5.0
    environment:
      discovery.type: single-node
      DISABLE_INSTALL_DEMO_CONFIG: 'true'
      DISABLE_SECURITY_PLUGIN: 'true'
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ulimits:
      nofile: {soft: 65536, hard: 65536}
    volumes: [search-data:/usr/share/opensearch/data]
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=3s" >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 60
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  valkey:
    image: valkey/valkey:9-alpine
    command: [valkey-server, --appendonly, 'yes']
    volumes: [valkey-data:/data]
    healthcheck:
      test: [CMD, valkey-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  rabbitmq:
    hostname: rabbitmq
    image: rabbitmq:4.3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-magento}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}
    ports: ['127.0.0.1:${RABBITMQ_PORT:-15673}:15672']
    volumes: [rabbit-data:/var/lib/rabbitmq]
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 10s
      timeout: 10s
      retries: 60
    restart: unless-stopped

  init:
    <<: *app
    build:
      context: .
      target: app
      args:
        MAGENTO_VERSION: ${MAGENTO_VERSION:-2.4.9}
    command: [install]
    depends_on:
      db: {condition: service_healthy}
      search: {condition: service_healthy}
      redis: {condition: service_healthy}
      valkey: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      erp: {condition: service_healthy}
    restart: 'no'

  php:
    <<: *app
    depends_on:
      init: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD-SHELL, 'php -r "exit(@fsockopen(\"localhost\",9000)?0:1);"']
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  nginx:
    image: ${NGINX_IMAGE:-clean-magento-nginx:local}
    build:
      context: .
      target: nginx
      args:
        MAGENTO_VERSION: ${MAGENTO_VERSION:-2.4.9}
    volumes:
      - app-config:/var/www/html/app/etc:ro
      - media:/var/www/html/pub/media:ro
      - static:/var/www/html/pub/static:ro
    depends_on:
      php: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://localhost:8080/health_check.php >/dev/null']
      interval: 15s
      timeout: 10s
      retries: 30
    restart: unless-stopped

  varnish:
    image: varnish:8
    environment:
      VARNISH_SIZE: 256M
    volumes: [varnish-config:/etc/varnish:ro]
    ports: ['127.0.0.1:${WEB_PORT:-8090}:80']
    depends_on:
      nginx: {condition: service_healthy}
    healthcheck:
      test: [CMD, varnishadm, ping]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  cron:
    <<: *app
    command: [bash, -c, 'while true; do php bin/magento cron:run; sleep 60; done']
    depends_on:
      nginx: {condition: service_healthy}
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:5-apache
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 128M
    ports: ['127.0.0.1:${PHPMYADMIN_PORT:-8091}:80']
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped

  erp:
    image: ${ERP_IMAGE:-clean-magento-erp:local}
    build: ./erp
    environment:
      ERP_API_TOKEN: ${ERP_API_TOKEN:?Set ERP_API_TOKEN}
    ports: ['127.0.0.1:${ERP_PORT:-8092}:8080']
    volumes: [erp-data:/data]
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://localhost:8080/health")']
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  db-data:
  search-data:
  redis-data:
  valkey-data:
  rabbit-data:
  app-config:
  media:
  app-var:
  generated:
  static:
  varnish-config:
  erp-data:
